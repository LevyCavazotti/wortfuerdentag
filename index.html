<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wort für den Tag — Ein Wort für Herz und Seele</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600&family=Playfair+Display:wght@400;500;600&display=swap"
  rel="stylesheet"
>

<style>

:root{

  --sky:#dff1fb;
  --sky-light:#f4fbff;

  --blue:#6ea9c8;
  --blue-dark:#315d78;
  --blue-deep:#254b63;

  --white:#ffffff;

  --text:#344957;
  --title:#24485e;
  --muted:#718694;

  --gold:#c8a86b;

  --border:#d8e8f0;

}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{

  margin:0;

  background:
    radial-gradient(
      circle at top,
      #ffffff 0%,
      var(--sky-light) 45%,
      var(--sky) 100%
    );

  color:var(--text);

  font-family:"Crimson Text",serif;

  line-height:1.75;

  min-height:100vh;
}


/* =========================
   HEADER
========================= */

header{

  text-align:center;

  padding:48px 20px 32px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.92),
      rgba(244,251,255,.82)
    );

  border-bottom:1px solid var(--border);

}

.symbol{

  font-size:1.25rem;

  color:var(--gold);

  margin-bottom:12px;

  letter-spacing:.18em;

  opacity:.9;

}

header h1{

  font-family:"Playfair Display",serif;

  font-weight:500;

  color:var(--blue-deep);

  font-size:2.45rem;

  margin:0;

}

header p{

  margin:8px 0 22px;

  color:var(--muted);

  font-style:italic;

  font-size:1.05rem;

}


/* =========================
   NAVIGATION
========================= */

nav{

  display:flex;

  justify-content:center;

  gap:28px;

  flex-wrap:wrap;

}

nav a{

  color:var(--blue-dark);

  text-decoration:none;

  font-size:1.05rem;

  padding:4px 9px;

  border-radius:20px;

  transition:.25s ease;

}

nav a:hover{

  background:#e6f4fb;

  color:var(--blue-deep);

}


/* =========================
   MAIN
========================= */

main{

  max-width:780px;

  margin:62px auto;

  padding:0 20px;

}


/* =========================
   CARD
========================= */

.card{

  background:rgba(255,255,255,.94);

  border:1px solid var(--border);

  border-top:4px solid var(--blue);

  border-radius:18px;

  padding:46px 46px 42px;

  box-shadow:
    0 18px 45px rgba(65,112,137,.10);

  position:relative;

  overflow:hidden;

}

.card:before{

  content:"✦";

  position:absolute;

  top:18px;

  right:24px;

  color:var(--gold);

  opacity:.55;

  font-size:1rem;

}

.card:after{

  content:"";

  position:absolute;

  width:180px;

  height:180px;

  border-radius:50%;

  background:#e8f7ff;

  top:-100px;

  right:-80px;

  opacity:.5;

  pointer-events:none;

}


/* =========================
   LABEL
========================= */

.label{

  text-transform:uppercase;

  letter-spacing:.18em;

  color:var(--blue);

  font-size:.78rem;

  font-weight:600;

}


/* =========================
   DATE
========================= */

.date{

  color:var(--muted);

  font-size:.95rem;

  margin:7px 0 28px;

  font-style:italic;

}


/* =========================
   QUOTE
========================= */

.quote{

  font-family:"Playfair Display",serif;

  font-size:1.7rem;

  line-height:1.65;

  color:var(--title);

  margin:0 0 24px;

}


/* =========================
   REFERENCE
========================= */

.reference{

  color:var(--blue-dark);

  font-style:italic;

  font-size:1.08rem;

}


/* =========================
   THEME
========================= */

.theme{

  display:inline-block;

  margin-top:18px;

  padding:5px 14px;

  border:1px solid #cfe3ed;

  border-radius:30px;

  background:#f4fbff;

  color:var(--blue-dark);

  font-size:.83rem;

}


/* =========================
   BUTTON
========================= */

.actions{

  display:flex;

  gap:12px;

  margin-top:32px;

  flex-wrap:wrap;

}

button{

  font:inherit;

  color:var(--blue-dark);

  background:#f4fbff;

  border:1px solid #a9cddd;

  border-radius:30px;

  padding:9px 22px;

  cursor:pointer;

  transition:.25s ease;

}

button:hover{

  background:var(--blue);

  border-color:var(--blue);

  color:white;

  box-shadow:
    0 7px 18px rgba(67,128,160,.18);

}


/* =========================
   INTRO
========================= */

.intro{

  margin-top:34px;

  text-align:center;

  color:var(--blue-dark);

  font-style:italic;

  font-size:1.05rem;

  opacity:.85;

}


/* =========================
   FOOTER
========================= */

footer{

  text-align:center;

  padding:34px 20px;

  color:#8296a3;

  border-top:1px solid var(--border);

  margin-top:75px;

  font-size:.92rem;

  background:rgba(255,255,255,.45);

}


/* =========================
   MOBILE
========================= */

@media(max-width:560px){

  header{
    padding:40px 18px 28px;
  }

  header h1{
    font-size:2rem;
  }

  main{
    margin:42px auto;
  }

  .card{
    padding:36px 25px 34px;
    border-radius:15px;
  }

  .quote{
    font-size:1.4rem;
  }

  nav{
    gap:15px;
  }

}

</style>

</head>


<body>


<header>

  <div class="symbol">
    ✝
  </div>

  <h1>
    Wort für den Tag
  </h1>

</header>



<main>


  <section class="card">


    <div class="label">
      Wort für heute
    </div>


    <div
      class="date"
      id="date"
    >
      Wird geladen...
    </div>


    <p
      class="quote"
      id="quote"
    >
      Einen Moment bitte...
    </p>


    <div
      class="reference"
      id="reference"
    ></div>


    <div
      class="theme"
      id="theme"
    ></div>


    <div class="actions">

      <button id="share">
        Teilen
      </button>

    </div>


  </section>


  <p class="intro">
    „Seid stille und erkennt, dass ich Gott bin.“
    — Psalm 46,11
  </p>


</main>



<footer>

  © 2026 — Wort für den Tag

  <br>

  Ein kleiner Moment des Friedens, des Glaubens und der Hoffnung.

</footer>



<script>

fetch("data/citacoes.json")

.then(response => {

  if(!response.ok){
    throw new Error("Daten konnten nicht geladen werden.");
  }

  return response.json();

})

.then(db => {

  const items = db.citacoes;

  if(!Array.isArray(items) || items.length === 0){
    throw new Error("Keine Bibelverse vorhanden.");
  }


  /*
  ==========================================
  ZEITZONE DES BENUTZERS
  ==========================================

  Der Browser kennt die lokale Zeitzone
  des Benutzers.

  Beispiele:

  Europe/Berlin
  America/Sao_Paulo
  America/New_York
  Asia/Tokyo

  Dadurch bekommt jeder Benutzer
  seinen eigenen lokalen Kalendertag.
  */

  const userTimeZone =
    Intl.DateTimeFormat().resolvedOptions().timeZone;



  /*
  ==========================================
  AKTUELLES LOKALES DATUM
  ==========================================

  Wir holen Jahr, Monat und Tag direkt
  aus der lokalen Zeitzone.

  Dadurch gibt es keine Probleme mit:

  - UTC
  - Mitternacht
  - Sommerzeit
  - Winterzeit
  - 23:00 / 00:00 Übergängen
  */

  const dateFormatter =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone: userTimeZone,
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }
    );


  const localDate =
    dateFormatter.format(
      new Date()
    );


  /*
  localDate sieht beispielsweise so aus:

  2026-09-12
  */


  const [
    year,
    month,
    day
  ] =
  localDate
    .split("-")
    .map(Number);



  /*
  ==========================================
  STARTDATUM
  ==========================================

  Der erste Tag der Versicle-Sequenz.

  WICHTIG:

  Wir verwenden hier nur Kalenderdaten,
  keine Uhrzeit.
  */

  const startYear = 2026;
  const startMonth = 1;
  const startDay = 1;



  /*
  ==========================================
  KALENDERTAGE BERECHNEN
  ==========================================

  Wir verwenden UTC NUR als mathematische
  Darstellung eines reinen Kalenderdatums.

  Dadurch ist jeder Tag exakt 24 Stunden
  lang und Sommer-/Winterzeit kann die
  Berechnung nicht beeinflussen.

  Der Benutzer bleibt trotzdem in seiner
  eigenen lokalen Zeitzone.
  */

  function daysFromCivilDate(
    y,
    m,
    d
  ){

    return Math.floor(
      Date.UTC(
        y,
        m - 1,
        d
      ) / 86400000
    );

  }



  const startDayNumber =
    daysFromCivilDate(
      startYear,
      startMonth,
      startDay
    );


  const todayDayNumber =
    daysFromCivilDate(
      year,
      month,
      day
    );


  /*
  ==========================================
  TAGE SEIT START
  ==========================================
  */

  let daysSinceStart =
    todayDayNumber -
    startDayNumber;


  /*
  Falls jemand die Website vor dem
  Startdatum besucht, verwenden wir
  den ersten Vers.
  */

  if(daysSinceStart < 0){
    daysSinceStart = 0;
  }



  /*
  ==========================================
  SEEDED RANDOM
  ==========================================

  Alle Benutzer erhalten dieselbe
  Reihenfolge für denselben Zyklus.
  */

  function seedRandom(seed){

    let x =
      seed >>> 0;

    return function(){

      x =
        (x + 0x6D2B79F5) | 0;

      let t =
        Math.imul(
          x ^ (x >>> 15),
          1 | x
        );

      t =
        t +
        Math.imul(
          t ^ (t >>> 7),
          61 | t
        ) ^ t;

      return (
        (t ^ (t >>> 14)) >>> 0
      ) / 4294967296;

    };

  }



  /*
  ==========================================
  NEUE ZUFÄLLIGE REIHENFOLGE
  ==========================================

  Jeder komplette Durchlauf erhält
  eine neue, aber reproduzierbare
  Reihenfolge.
  */

  function shuffledForCycle(cycle){

    const arr =
      [...items];


    const seed =
      734287 +
      (cycle * 1000003);


    const random =
      seedRandom(seed);


    /*
    Fisher-Yates Shuffle
    */

    for(
      let i = arr.length - 1;
      i > 0;
      i--
    ){

      const j =
        Math.floor(
          random() * (i + 1)
        );


      [
        arr[i],
        arr[j]
      ] =
      [
        arr[j],
        arr[i]
      ];

    }


    return arr;

  }



  /*
  ==========================================
  ZYKLUS
  ==========================================

  Beispiel mit 15 Versen:

  Tag 0  → Zyklus 0 / Position 0
  Tag 1  → Zyklus 0 / Position 1
  ...
  Tag 14 → Zyklus 0 / Position 14

  Tag 15 → Zyklus 1 / Position 0
  Tag 16 → Zyklus 1 / Position 1

  usw.
  */


  const cycle =
    Math.floor(
      daysSinceStart /
      items.length
    );


  const positionInCycle =
    daysSinceStart %
    items.length;



  /*
  ==========================================
  AKTUELLE REIHENFOLGE
  ==========================================
  */

  const order =
    shuffledForCycle(
      cycle
    );


  const item =
    order[
      positionInCycle
    ];



  /*
  ==========================================
  DATUM ANZEIGEN
  ==========================================
  */

  const displayFormatter =
    new Intl.DateTimeFormat(
      "de-DE",
      {
        timeZone: userTimeZone,
        day: "2-digit",
        month: "long",
        year: "numeric"
      }
    );


  document.getElementById(
    "date"
  ).textContent =
    displayFormatter.format(
      new Date()
    );



  /*
  ==========================================
  BIBELVERS
  ==========================================
  */

  document.getElementById(
    "quote"
  ).textContent =
    "„" +
    item.texto +
    "“";



  /*
  ==========================================
  REFERENZ
  ==========================================
  */

  document.getElementById(
    "reference"
  ).textContent =
    "— " +
    item.referencia;



  /*
  ==========================================
  THEMA
  ==========================================
  */

  document.getElementById(
    "theme"
  ).textContent =
    item.tema;



  /*
  ==========================================
  TEILEN
  ==========================================
  */

  document.getElementById(
    "share"
  ).onclick = async () => {

    const text =
      `„${item.texto}“ — ${item.referencia}`;


    const url =
      location.href;


    if(navigator.share){

      try{

        await navigator.share({

          title:
            "Wort für den Tag",

          text,

          url

        });

      }

      catch(e){}

    }

    else{

      try{

        await navigator.clipboard.writeText(
          `${text}\n\n${url}`
        );


        alert(
          "Wort und Link wurden kopiert."
        );

      }

      catch(e){

        alert(
          `${text}\n\n${url}`
        );

      }

    }

  };

})


.catch(error => {

  console.error(error);


  document.getElementById(
    "quote"
  ).textContent =
    "Das Wort des Tages konnte nicht geladen werden.";


  document.getElementById(
    "reference"
  ).textContent = "";


  document.getElementById(
    "theme"
  ).textContent = "";

});

</script>

  
</body>

</html>
